<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rivenbrook - A Tale of the Thornwilds</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0812;
    background-image: radial-gradient(circle at 50% 12%, #1d1c38 0%, #0a0812 70%);
    color: #cdd3f0;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden;
    /* No pinch-zoom, double-tap zoom or pull-to-refresh stealing a thumb. */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0812;
    border: 2px solid #3a3a6a;
    border-radius: 3px;
    box-shadow: 0 0 0 1px #12102a, 0 14px 40px rgba(0,0,0,.65);
  }
  /* On a phone the frame, its shadow and the gap around it are all screen the
     game could be using. */
  body.touch #stage { gap: 0; }
  body.touch canvas { border: 0; border-radius: 0; box-shadow: none; }
  #hint { font-size: 11px; letter-spacing: .06em; opacity: .62; text-align: center; }
  #hint b { color: #f6e2a8; font-weight: 600; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; letter-spacing: .2em; color: #8f97c0; background: #0a0812;
  }
  /* Touch controls. The layer is inert apart from the A/B/menu cluster: the
     stick and the on-canvas menu buttons are handled from window-level touch
     handlers, so nothing here can swallow a tap meant for the game. */
  #touch { display: none; position: fixed; inset: 0; user-select: none; pointer-events: none; }
  #stick {
    position: absolute; width: 116px; height: 116px; margin: -58px 0 0 -58px;
    border-radius: 50%; border: 2px solid rgba(150,160,235,.45);
    background: radial-gradient(circle, rgba(48,50,96,.42) 0%, rgba(28,30,62,.30) 70%,
                                rgba(28,30,62,.12) 100%);
    opacity: 0; transition: opacity .12s ease-out; will-change: transform, opacity;
  }
  /* The stick only exists while a thumb is on it. */
  #stick.on { opacity: 1; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%; border: 2px solid rgba(170,180,250,.75);
    background: radial-gradient(circle at 38% 34%, rgba(130,145,240,.85), rgba(58,62,120,.85));
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  #touch .btns { position: absolute; right: 10px; bottom: 22px; display: flex; gap: 9px;
    pointer-events: auto; touch-action: none; }
  #touch button {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid #4a4a80; background: rgba(40,42,80,.72); color: #e8ecff;
    font: 600 13px/1 ui-monospace, monospace;
  }
  #touch button.on { background: rgba(120,140,240,.8); }

</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="320" height="180"></canvas>
  <div id="hint">
    <b>Arrows/WASD</b> move &nbsp;·&nbsp; <b>Z</b> confirm &nbsp;·&nbsp; <b>X</b> cancel/dash &nbsp;·&nbsp;
    <b>C</b> menu &nbsp;·&nbsp; <b>M</b> mute
  </div>
</div>
<div id="loading">LOADING&hellip;</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="btns">
    <button data-act="cancel">B</button>
    <button data-act="confirm">A</button>
    <button data-act="menu">&#9776;</button>
  </div>
</div>
<script>
/*__ASSETS__*/
</script>
<script>
/*__FONT__*/
</script>
<script>
/*__GAME__*/
</script>
</body>
</html>
