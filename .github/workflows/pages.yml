# Build the browser build, prove it plays, then publish it to GitHub Pages.
#
# The smoke test drives the whole game in a real Chromium through Playwright,
# pinned in package.json, so a clean clone and this runner get the same
# browser build the harness was written against. A red smoke test means no
# publish: the page stays on the last version that passed.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the browser harness
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Cook the assets and build index.html
        run: python3 tools/build.py
      - name: Lint the Godot scripts against the cooked data
        run: python3 tools/gdlint.py
      - name: Smoke-test the browser build
        run: python3 tools/websmoke.py
      - name: Keep the built page for publishing
        run: |
          mkdir -p site
          cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
